# デプロイ：GitHub Actions → Artifact Registry → Cloud Run（SPEC §9）
#
# - 手動実行（Actions → Deploy → Run workflow）でデモ／本番を選ぶ
# - main への push では、リポジトリ変数 AUTO_DEPLOY_DEMO が "true" のときだけデモへ自動デプロイする
# - GCP へは Workload Identity Federation で認証する（サービスアカウントの鍵ファイルは使わない）
# - GitHub の Environment（demo / production）ごとに変数を設定する（値は infra/05-github-wif.sh が表示する）
#     GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, GCP_AR_REPOSITORY,
#     CLOUD_RUN_SERVICE, APP_IMAGE_NAME, TOOLS_IMAGE_NAME, MIGRATE_JOB, SEED_JOB
#   production の Environment に承認者を設定すると、承認されるまで本番へのデプロイは始まらない
#
# このワークフローはイメージの差し替えだけを行う。環境変数・シークレット・Cloud SQL 接続などの設定は
# infra/07-deploy.sh が正（初回は必ず 07-deploy.sh でデプロイしておく。設定を変えたときも 07-deploy.sh を使う）。
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先
        type: choice
        options: [demo, production]
        default: demo
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Workload Identity Federation 用の OIDC トークン

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: デプロイ（${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}）
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_DEMO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'demo' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      SEED_JOB: ${{ vars.SEED_JOB }}
      APP_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}:${{ github.sha }}
      TOOLS_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/${{ vars.TOOLS_IMAGE_NAME }}:${{ github.sha }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: 設定の確認
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
          AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          APP_IMAGE_NAME: ${{ vars.APP_IMAGE_NAME }}
          TOOLS_IMAGE_NAME: ${{ vars.TOOLS_IMAGE_NAME }}
        run: |
          missing=""
          for v in PROJECT_ID REGION SERVICE MIGRATE_JOB SEED_JOB WIF_PROVIDER DEPLOYER_SA AR_REPOSITORY APP_IMAGE_NAME TOOLS_IMAGE_NAME; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Environment 変数が足りません:${missing}（infra/05-github-wif.sh の表示を参照）"
            exit 1
          fi

      - uses: actions/checkout@v4

      - id: auth
        name: GCP に認証（Workload Identity Federation）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry にログイン
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: イメージのビルドと登録（runner）
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.APP_IMAGE }}
          build-args: NODE_IMAGE=mirror.gcr.io/library/node:22-bookworm-slim
          cache-from: type=gha,scope=we-order
          cache-to: type=gha,scope=we-order,mode=max

      - name: イメージのビルドと登録（tools）
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: ${{ env.TOOLS_IMAGE }}
          build-args: NODE_IMAGE=mirror.gcr.io/library/node:22-bookworm-slim
          cache-from: type=gha,scope=we-order

      - name: DBマイグレーション（Cloud Run ジョブ）
        run: |
          if ! gcloud run jobs describe "$MIGRATE_JOB" --region="$REGION" >/dev/null 2>&1; then
            echo "::error::Cloud Run ジョブ ${MIGRATE_JOB} がありません。初回は infra/07-deploy.sh でデプロイしてください。"
            exit 1
          fi
          gcloud run jobs update "$MIGRATE_JOB" --region="$REGION" --image="$TOOLS_IMAGE" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region="$REGION" --wait

      - name: シード用ジョブのイメージ更新（実行はしない）
        run: |
          if gcloud run jobs describe "$SEED_JOB" --region="$REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$SEED_JOB" --region="$REGION" --image="$TOOLS_IMAGE" --quiet
          fi

      - id: deploy
        name: Cloud Run にデプロイ
        run: |
          if ! gcloud run services describe "$SERVICE" --region="$REGION" >/dev/null 2>&1; then
            echo "::error::Cloud Run サービス ${SERVICE} がありません。初回は infra/07-deploy.sh でデプロイしてください。"
            exit 1
          fi
          # イメージだけを差し替える（環境変数・シークレット・Cloud SQL 接続・公開設定は前のリビジョンを引き継ぐ）
          gcloud run deploy "$SERVICE" --region="$REGION" --image="$APP_IMAGE" --quiet
          url="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: 起動確認
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "${URL}/api/health" >/dev/null; then
              echo "起動を確認しました：${URL}"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::${URL}/api/health から応答がありません。Cloud Run のログを確認してください。"
          exit 1
