# Cloud Build でコンテナイメージを2つ作って Artifact Registry に登録する（07-deploy.sh から使う）
#   _APP_IMAGE   : Cloud Run サービス用（Dockerfile の runner ターゲット）
#   _TOOLS_IMAGE : マイグレーション・シード用（Dockerfile の tools ターゲット）
# 2つ目のビルドは1つ目の依存パッケージ層をそのまま使うため、順番に実行する。
steps:
  - id: build-app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - --build-arg=NODE_IMAGE=${_NODE_IMAGE}
      - --tag=${_APP_IMAGE}
      - .
  - id: build-tools
    name: gcr.io/cloud-builders/docker
    waitFor: [build-app]
    args:
      - build
      - --target=tools
      - --build-arg=NODE_IMAGE=${_NODE_IMAGE}
      - --tag=${_TOOLS_IMAGE}
      - .
images:
  - ${_APP_IMAGE}
  - ${_TOOLS_IMAGE}
substitutions:
  # Docker Hub の回数制限を避けるため、Google のミラーから取得する
  _NODE_IMAGE: mirror.gcr.io/library/node:22-bookworm-slim
  _APP_IMAGE: ""
  _TOOLS_IMAGE: ""
options:
  # デプロイSAで実行するため、ログは Cloud Logging のみに出す（ログ用バケット不要）
  logging: CLOUD_LOGGING_ONLY
  # next build のメモリ不足を避ける
  machineType: E2_HIGHCPU_8
timeout: 1800s
